<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#FFFDE7">
  <meta name="description" content="RisFiz — our story, growing together">
  <meta name="robots" content="noindex, nofollow">
  <title>RisFiz</title>
  <link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700,900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=10">
</head>
<body>
  <div class="bg-leaves" id="bg-leaves" aria-hidden="true"></div>

  <nav class="site-nav" id="site-nav" aria-label="Site navigation">
    <a href="#hero" class="nav-link">Home</a>
    <a href="#plant" class="nav-link">Our Plant</a>
    <a href="#messages" class="nav-link">Messages</a>
  </nav>

  <main class="main-content" id="main-content">
    <!-- Hero -->
    <section class="hero section" id="hero">
      <div class="hero-content reveal">
        <p class="hero-label">RisFiz</p>
        <h1 class="hero-title">
          <span class="hero-risfiz">
            <span class="hero-ris">Ris</span><span class="hero-fiz">Fiz</span>
          </span>
        </h1>
        <p class="hero-days" id="hero-days"></p>
        <p class="hero-distance" id="hero-distance"></p>
      </div>
    </section>

    <!-- Growing Plant Timeline -->
    <section class="plant section" id="plant">
      <div class="section-header reveal">
        <h2>Our Growing Plant</h2>
        <p class="section-subtitle">Tanaman Kita yang Tumbuh</p>
      </div>

      <div class="plant-container" id="plant-container">
        <svg class="plant-vine-svg" id="plant-vine-svg" aria-hidden="true"></svg>
        <div class="plant-nodes" id="plant-memories"></div>
      </div>
    </section>

    <!-- Messages -->
    <section class="messages section" id="messages">
      <div class="message-forms">
        <!-- Fiz → Ris (green) -->
        <div class="message-card message-card-fiz reveal">
          <div class="message-card-header">
            <span class="message-avatar message-avatar-fiz">F</span>
            <div>
              <h3>From Fiz</h3>
              <p class="message-to">To Ris</p>
            </div>
          </div>
          <form class="message-form" id="form-fiz">
            <textarea name="message" rows="4" placeholder="Write something for Ris..." required></textarea>
            <input type="text" name="_honey" class="honeypot" tabindex="-1" autocomplete="off" aria-hidden="true">
            <button type="submit" class="btn-send btn-send-fiz">Send to Ris</button>
          </form>
          <p class="form-status hidden" id="form-fiz-status"></p>
        </div>

        <!-- Ris → Fiz (yellow) -->
        <div class="message-card message-card-ris reveal">
          <div class="message-card-header">
            <span class="message-avatar message-avatar-ris">R</span>
            <div>
              <h3>From Ris</h3>
              <p class="message-to">To Fiz</p>
            </div>
          </div>
          <form class="message-form" id="form-ris">
            <textarea name="message" rows="4" placeholder="Tulis sesuatu untuk Fiz..." required></textarea>
            <input type="text" name="_honey" class="honeypot" tabindex="-1" autocomplete="off" aria-hidden="true">
            <button type="submit" class="btn-send btn-send-ris">Send to Fiz</button>
          </form>
          <p class="form-status hidden" id="form-ris-status"></p>
        </div>
      </div>
    </section>
  </main>

  <script src="js/main.js?v=23"></script>
</body>
</html>
